<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0b1020"/>
  <!-- two lenses looking at the same asset from different positions -->
  <circle cx="52" cy="64" r="30" fill="none" stroke="url(#pa)" stroke-width="7"/>
  <circle cx="76" cy="64" r="30" fill="none" stroke="url(#pb)" stroke-width="7" opacity="0.92"/>
  <!-- the asset: one point, two readings -->
  <circle cx="64" cy="64" r="7.5" fill="#f8fafc"/>
  <!-- the spread between them -->
  <path d="M40 98 H88" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 92 V104 M88 92 V104" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
</svg>
